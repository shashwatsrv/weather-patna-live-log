name: hourly live forecast

on:
  schedule:
    # Every 15 minutes: GitHub drops many scheduled runs when busy, so several tries per hour
    # make sure at least one gets through. Extra runs in the same hour log nothing (dedupe).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check out the frozen project code
        uses: actions/checkout@v4
        with:
          repository: shashwatsrv/weather-forecasting-patna
          ref: eb987d58c93e05e47b26eb1a40fdd273659537be     # pinned: the live test runs frozen code
          path: project
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - run: pip install -r requirements-live.txt
      - name: Log one forecast per horizon
        working-directory: project
        env:
          WEATHER_DATA_DIR: ${{ github.workspace }}/data
        run: python -m src.live.log_forecasts
      - name: Commit new rows
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # commit only when new rows were logged, or when the run failed (so the failure is kept)
          if git diff --quiet -- data/live/forecast_log.csv && [ "${{ job.status }}" = "success" ]; then
            echo "No new rows this run; nothing to commit."
            exit 0
          fi
          git add data/live
          if ! git diff --cached --quiet; then
            git commit -m "Log forecast $(date -u +%Y-%m-%dT%H:00Z)"
            git pull --rebase
            git push
          fi
