name: hourly live forecast

on:
  schedule:
    - cron: "17 * * * *"        # every hour at :17 UTC (GitHub may start it late)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check out the frozen project code
        uses: actions/checkout@v4
        with:
          repository: shashwatsrv/weather-forecasting-patna
          ref: eb987d58c93e05e47b26eb1a40fdd273659537be     # pinned: the live test runs frozen code
          path: project
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - run: pip install -r requirements-live.txt
      - name: Log one forecast per horizon
        working-directory: project
        env:
          WEATHER_DATA_DIR: ${{ github.workspace }}/data
        run: python -m src.live.log_forecasts
      - name: Commit new rows
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          if ! git diff --cached --quiet; then
            git commit -m "Log forecast $(date -u +%Y-%m-%dT%H:00Z)"
            git pull --rebase
            git push
          fi
